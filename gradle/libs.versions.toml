[versions]
# Build stack (chosen for mutual compatibility; AGP 8.13.x is the newest AGP line verified
# against Gradle 8.14.x and Kotlin 2.4.x — AGP 9.x requires the built-in-Kotlin migration)
agp = "8.13.2"
kotlin = "2.4.20"
gradleWrapper = "8.14.5"

kotlinxSerializationJson = "1.11.0"
junitJupiter = "5.14.4"
junitPlatform = "1.14.4"

# OkHttp: 5.x's okhttp-android AAR requires compileSdk 37 — incompatible with the
# ratified compileSdk 36 law (vision 01 §3); 4.12.0 is the latest unconstrained line
okhttp = "4.12.0"

# Pure-JVM coroutines for :core (suspend transports; the JVM artifact resolves via
# Gradle variant metadata — no Android artifact on :core)
kotlinxCoroutinesCore = "1.9.0"
room = "2.8.5"
onnxruntimeAndroid = "1.30.0"
composeBom = "2025.12.01"
activityCompose = "1.13.0"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntimeAndroid" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
