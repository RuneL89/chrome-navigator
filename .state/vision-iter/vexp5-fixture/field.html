<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VEXP5 field</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; font-family: sans-serif; }
    h1 { margin: 28px 24px 8px; font-size: 28px; color: #222; }
    p { margin: 0 24px; font-size: 18px; color: #555; }
    #bottom-field {
      position: fixed;
      right: 24px;
      bottom: 60px;
      width: 210px;
      height: 64px;
      font-size: 20px;
      padding: 8px 12px;
      border: 3px solid #1565c0;
      border-radius: 10px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <h1>VEXP5 FIELD PAGE</h1>
  <p>The text field sits in the bottom-right corner, under the live log.</p>
  <input id="bottom-field" aria-label="NOTE FIELD" placeholder="NOTE FIELD">
  <script>
    document.getElementById('bottom-field').addEventListener('input', function (e) {
      document.title = 'NOTE:' + e.target.value;
    });
  </script>
</body>
</html>
