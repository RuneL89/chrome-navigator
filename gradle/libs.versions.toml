[versions]
# Build stack (chosen for mutual compatibility; AGP 8.13.x is the newest AGP line verified
# against Gradle 8.14.x and Kotlin 2.4.x — AGP 9.x requires the built-in-Kotlin migration)
agp = "8.13.2"
kotlin = "2.4.20"
gradleWrapper = "8.14.5"

kotlinxSerializationJson = "1.11.0"
junitJupiter = "5.14.4"
junitPlatform = "1.14.4"

# KSP: decoupled versioning since 2.3.x (the old <kotlin>-<ksp> line ended at 2.2.21);
# 2.3.12 is the current line serving Kotlin 2.4.x — required by the Room compiler (Phase 5)
ksp = "2.3.12"
robolectric = "4.16"
androidxTestJunit = "1.3.0"

# OkHttp: 5.x's okhttp-android AAR requires compileSdk 37 — incompatible with the
# ratified compileSdk 36 law (vision 01 §3); 4.12.0 is the latest unconstrained line
okhttp = "4.12.0"

# Pure-JVM coroutines for :core (suspend transports; the JVM artifact resolves via
# Gradle variant metadata — no Android artifact on :core)
kotlinxCoroutinesCore = "1.9.0"
room = "2.8.5"
onnxruntimeAndroid = "1.30.0"
# Desktop ONNX Runtime, TEST-ONLY (Gates 8.1/8.3 run the real int8 graph on the JVM;
# same ai.onnxruntime Java API as the Android AAR). NOT in lockstep with the AAR: the
# 1.30 desktop build segfaults on this dev box (measured — the Python wheel AND the JVM
# native both access-violate on real inference; 1.20.0 is the verified desktop runtime
# (Maven Central skips 1.20.1 for the Java package); the graph is opset 18, readable by
# both). The device AAR stays 1.30.0 — a different binary on a different OS; Gate 8.4
# proves it on the emulator.
onnxruntimeDesktop = "1.20.0"
composeBom = "2025.12.01"
activityCompose = "1.13.0"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntimeAndroid" }
# Desktop JVM runtime for the laya gates (test-only — never shipped in the APK)
onnxruntime-desktop = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntimeDesktop" }

# Room DAO gate (5.1) runs the database on the JVM under Robolectric (test-only)
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitJupiter" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
