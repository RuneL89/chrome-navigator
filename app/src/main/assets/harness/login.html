<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account login</title></head>
<body style="font-family:sans-serif;padding:24px">
  <h1>Sign in</h1>
  <form onsubmit="return false">
    <p><label>Username</label><br><input id="user" type="text"></p>
    <p><label>Password</label><br><input id="pass" type="password"></p>
    <p><button id="go" type="submit">Sign in</button></p>
  </form>
</body>
</html>
