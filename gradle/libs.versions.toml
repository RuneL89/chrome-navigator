[versions]
# Build stack (chosen for mutual compatibility; AGP 8.13.x is the newest AGP line verified
# against Gradle 8.14.x and Kotlin 2.4.x — AGP 9.x requires the built-in-Kotlin migration)
agp = "8.13.2"
kotlin = "2.4.20"
gradleWrapper = "8.14.5"

kotlinxSerializationJson = "1.11.0"
junitJupiter = "5.14.4"
junitPlatform = "1.14.4"

robolectric = "4.16"
androidxTestJunit = "1.3.0"

# OkHttp: 5.x's okhttp-android AAR requires compileSdk 37 — incompatible with the
# ratified compileSdk 36 law (vision 01 §3); 4.12.0 is the latest unconstrained line
okhttp = "4.12.0"

# Pure-JVM coroutines for :core (suspend transports; the JVM artifact resolves via
# Gradle variant metadata — no Android artifact on :core)
kotlinxCoroutinesCore = "1.9.0"
composeBom = "2025.12.01"
activityCompose = "1.13.0"

# Phase 9: the owner's OpenRouter key storage (EncryptedSharedPreferences). The 1.1.x
# line is alpha-only upstream (there is no stable 1.1.0) — alpha06 is the newest
# published artifact of the line (deviation noted in the phase status file).
securityCrypto = "1.1.0-alpha06"
# Phase 9 instrumented gates (9.1-9.4): AndroidX test runner + ext-junit + uiautomator
# (UiDevice/UiAutomation for the injected taps and the through-touch assertions).
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"
uiautomator = "2.3.0"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }

# Prefs round-trip gate runs on the JVM under Robolectric (test-only)
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitJupiter" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# The core icon set (Check/Warning/Info/Lock) — newer material3 BOMs stopped shipping
# it transitively; the setup wizard's status chips consume it.
compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Phase 9: encrypted key storage + the instrumented-gate test stack
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
